# ============================================================================
# kopy 模板配置 | kopy template configuration
#
# 用法 | Usage:
#   kopy new https://github.com/kamalyes/kronos-service-template -o ./my-service
#   kopy list ./kronos-service-template          # 查看全部变量 | inspect variables
#
# ⚠️ 定界符是 <% %>，不是 kopy 默认的 [[ ]] | Delimiters are <% %>, NOT the default
#
# 原因：bash 的条件测试语法本身就是双方括号（if [[ -t 1 ]]），字符类也是（[[:space:]]），
# 与 kopy 默认定界符 [[ ]] 冲突。用默认定界符时 scripts/init.sh 直接渲染失败，
# 报 `bad number syntax: "-t"`——模板引擎把 [[ -t 1 ]] 当成了模板动作。
# 换成 <% %> 后，生产仓库里的 shell 脚本可以逐字节同步进来，不必为模板引擎
# 把 [[ ]] 改写成 [ ]（改写会悄悄改变语义，比如 =~ 和 && 的行为）。
# 与 kronos-share-proto-template 用同一套定界符。
#
# [EN] Reason: bash's own test syntax uses double brackets (if [[ -t 1 ]]), as do character
# classes ([[:space:]]), which collide with kopy's default [[ ]]; scripts/init.sh then fails
# to render with `bad number syntax: "-t"`. With <% %>, shell scripts from a real repository
# sync in byte for byte. Same delimiters as kronos-share-proto-template.
#
# 渲染规则 | Rendering rules:
#   - 文件「内容」和「路径」都会过模板引擎
#   - 变量值一律是字符串，判断布尔要写 eq .X "true"
#   - 执行顺序是先 rename 再 ignore，且 ignore 判定看的是渲染后的路径
#
# [EN] Delimiters are kopy's default <% %>; both file contents and paths are rendered.
# Every value is a string, so booleans are compared via eq .X "true".
# rename runs before ignore, and ignore matches the RENDERED path.
#
# ⚠️ 最低 kopy 版本 | Minimum kopy version
#
# 本模板用到三项在旧版 kopy 上不成立的行为，用旧版生成会静默出错：
#   1. 问题的 default 可以引用前面已答的变量（旧版渲染 default 时上下文为空，
#      会得到 <no value>，带过滤器的还会把模板原文当成答案）；
#   2. ignore 模式本身会被渲染（否则下面按变量条件性排除文件的规则全部失效，
#      GenerateExample=false 之类的开关会变成空开关）；
#   3. hooks.after 会被执行（否则生成后不会自动初始化）
# 这三项在 kopy 的 0946879 / 09b74c8 / bc22c45 三个提交里修好
#
# [EN] This template relies on three behaviours that older kopy builds lack, and an older
# build fails silently: defaults may reference earlier answers; ignore patterns are
# themselves rendered (otherwise every conditional exclusion below is a no-op); and
# hooks.after is executed.
# ============================================================================

name: kronos-service
description: kronos 微服务脚手架模板 - Go gRPC 微服务，接协议中心、pbmo 转换、sqlbuilder 仓储、go-bizerror 错误与 go-argus 校验 | Go gRPC microservice scaffold wired to a contract hub, with pbmo conversion, sqlbuilder repositories, go-bizerror errors and go-argus validation
version: 2.0.0
author: kamalyes
tags: [go, grpc, microservice, kronos, pbmo, sqlbuilder]

delimiters:
  - "<%"
  - "%>"

questions:
  # --------------------------------------------------------------------------
  # 项目身份 | Project identity
  #
  # 下面几个 default 引用前面的答案，顺序不能打乱：被引用的问题必须排在前面
  # [EN] Several defaults below reference earlier answers, so the order matters:
  # a referenced question must come first.
  # --------------------------------------------------------------------------
  - name: OrgName
    prompt: "组织名称（GitHub 组织或用户名，用于 Go 模块路径）| GitHub org or user name, used in the Go module path"
    type: string
    default: kamalyes
    required: true

  - name: ObjectPrefix
    prompt: "组织前缀（用于项目名 {prefix}-{type}-service 与协议中心仓库名）| Project prefix for {prefix}-{type}-service and the contract-hub repository"
    type: string
    default: kronos
    required: true

  - name: ServiceType
    prompt: "服务类型标识（如 open / payment / core）| Service type identifier"
    type: string
    default: my
    required: true

  - name: ServiceName
    prompt: "gRPC 服务名（PascalCase，与 proto 里的 service 同名）| gRPC service name, matching the service in the proto"
    type: string
    default: "<% .ServiceType | pascal %>Service"
    required: true

  - name: ModuleName
    prompt: "模块名（小写短横线，用于目录名与镜像名）| Module name, lower kebab, used for directory and image names"
    type: string
    default: "<% .ServiceType %>-service"
    required: true

  - name: ProjectName
    prompt: "项目名称（仓库名 / 目录名）| Repository and directory name"
    type: string
    default: "<% .ObjectPrefix %>-<% .ServiceType %>-service"
    required: true

  - name: AuthorName
    prompt: "作者名称 | Author name"
    type: string
    default: kamalyes
    required: true

  - name: AuthorEmail
    prompt: "作者邮箱 | Author email"
    type: string
    default: example@qq.com
    required: true

  - name: GoVersion
    prompt: "Go 版本 | Go version"
    type: select
    choices: ["1.22", "1.23", "1.24", "1.25"]
    default: "1.25"

  - name: BaseBranch
    prompt: "主干分支（CI 触发基线）| Trunk branch for CI triggers"
    type: select
    choices: ["master", "main"]
    default: "master"

  # --------------------------------------------------------------------------
  # AI 协作工具 | AI coding assistant
  #
  # 开发指南 skill 在模板里只有一份正文（__ai_home__/），渲染时按这里的选择落到
  # 对应工具的目录各家读取位置不同：Trae 读 .trae/，Claude Code 读 .claude/，
  # Cursor 读 .cursor/，VS Code 系扩展读 .vscode/
  # 取值与默认值和 kronos-share-proto-template / openapi-ts-sdk-template 保持一致
  #
  # [EN] The development skill exists once under __ai_home__/ and lands in the directory
  # the chosen assistant reads. Same choices and default as the sibling templates.
  # --------------------------------------------------------------------------
  - name: AiAssistant
    prompt: "AI 协作工具目录（开发指南 skill 落到哪）| Directory of the AI coding assistant that reads the skill"
    type: select
    choices: [".trae", ".claude", ".cursor", ".vscode"]
    default: ".trae"

  # --------------------------------------------------------------------------
  # 协议中心 | Contract hub
  #
  # 服务的 proto 契约不在本仓库，而来自协议中心（kronos-share-proto-template
  # 生成的仓库）只有 models/base.go 依赖它的 pb/common（Paging / LocalizedText）
  #
  # [EN] The proto contract lives in a contract hub generated from
  # kronos-share-proto-template, not here. Only models/base.go depends on its pb/common.
  # --------------------------------------------------------------------------
  - name: ShareProtoModule
    prompt: "协议中心 Go 模块路径 | Go module path of the contract hub"
    type: string
    # 默认直接指向协议中心模板仓库的 build 分支，让生成出来的服务开箱即能编译、能跑。
    #
    # 为什么是 build 分支而不是另一个仓库：kronos-share-proto-template 的 master
    # 全是 kopy 占位符（proto/__module__/ 之类），不是合法 Go，go get 拉不动。
    # 它的 CI 会把自己按默认变量渲染一遍、跑完 protoc 生成、验证能编译，
    # 然后把结果强推到 build 分支。于是同一个仓库同时是「模板」和「可消费的依赖」，
    # 不必再维护一个单独的样板 hub 仓库，两边的模块划分也不会各自漂移。
    #
    # 模块划分与本模板的默认值一一对应：catalog/Product、inventory/Warehouse、
    # tenant/Tenant（+ TenantMember），示例实现对接的就是其中的 catalog/Product。
    #
    # 接真实项目时改成自己的协议中心（按 kronos-share-proto-template 生成一份，
    # 生成出来的仓库自己的 CI 会把 pb 提交回它的主干，那时版本填 latest 或具体 tag）。
    #
    # [EN] Points at the contract-hub template's build branch so a freshly generated service
    # compiles and runs out of the box. Its master is all kopy placeholders and not valid Go, so
    # go get cannot fetch it; its CI renders the template with the default variables, runs the
    # protoc generation, verifies it builds and force-pushes the result to build. One repository
    # is therefore both the template and a consumable dependency, with no separate sample hub to
    # maintain and no chance of the two drifting apart in module layout. The modules line up
    # one-to-one with this template's defaults. For a real project, point this at your own hub
    # generated from the template, whose own CI commits pb back to its trunk, and pin latest or
    # a tag as the version.
    default: "github.com/kamalyes/kronos-share-proto-template"
    required: true

  - name: ShareProtoVersion
    prompt: "协议中心依赖版本（latest 则由 init 脚本解析最新 commit）| Contract-hub version, or latest to resolve the newest commit"
    type: string
    default: "latest"
    required: true

  # --------------------------------------------------------------------------
  # 运行参数 | Runtime
  # --------------------------------------------------------------------------
  - name: GRPCPort
    prompt: "gRPC 端口 | gRPC port"
    type: int
    default: "9190"

  - name: HTTPPort
    prompt: "HTTP 端口 | HTTP port"
    type: int
    default: "8190"

  - name: HealthPort
    prompt: "健康检查端口 | Health check port"
    type: int
    default: "8191"

  - name: DBName
    prompt: "数据库名称 | Database name"
    type: string
    default: "<% .ServiceType | snake %>_service"
    required: true

  - name: CachePrefix
    prompt: "缓存键前缀 | Cache key prefix"
    type: string
    default: "<% .ServiceType | snake %>:"
    required: true

  - name: MetricsNamespace
    prompt: "监控指标命名空间 | Metrics namespace"
    type: string
    default: "<% .ServiceType | snake %>"
    required: true

  - name: DefaultLocale
    prompt: "校验与业务错误的默认语言 | Default locale for validation and business errors"
    type: select
    choices: ["zh", "en", "zh-TW", "ja", "ko", "fr", "de", "es", "ru"]
    default: "zh"

  # --------------------------------------------------------------------------
  # 功能开关 | Feature toggles
  #
  # 这些开关既在文件内容里用 <% if eq .X "true" %> 控制代码分支，也在下面的
  # ignore 规则里控制整个文件是否生成两处都要改，只改一处会留下孤立文件或断引用
  #
  # [EN] Each toggle controls code branches inside files AND whether whole files are
  # emitted (see the ignore rules). Both places must agree, or you get orphan files
  # or dangling references.
  # --------------------------------------------------------------------------
  - name: UseRedis
    prompt: "是否使用 Redis | Use Redis"
    type: bool
    default: "true"

  # 默认开：subscriber.go 里装的是下游同步 worker，也就是服务间 gRPC 调用的示例。
  # 关掉的话那个 worker 不会生成，远程调用示例就只剩客户端装配、没有调用方。
  # [EN] On by default: subscriber.go holds the downstream sync worker, which is the
  # service-to-service gRPC example. With it off the worker is not emitted and the remote-call
  # example is left with client assembly but no caller.
  - name: UseSubscriber
    prompt: "是否启用后台任务与事件订阅（含服务间调用示例）| Enable background tasks and subscriptions, including the service-to-service example"
    type: bool
    default: "true"

  - name: GenerateExample
    prompt: "是否生成示例 Model / Repository / Service（否则只生成工程骨架）| Generate the example model, repository and service, or scaffolding only"
    type: bool
    default: "true"

  # --------------------------------------------------------------------------
  # 示例实现对接的协议中心模块 | Which contract-hub module the example implements
  #
  # 示例不是凭空造的实体，而是真的实现协议中心里那个 service：
  # 导入 <ShareProtoModule>/pb/<ExampleModule>，实现 <ExampleService>ServiceServer
  # 的全部 RPC，并在 bootstrap 里真实注册。所以这两个值必须与协议中心生成时填的
  # ExampleModule / ExampleService 一致，否则 import 路径与类型名对不上、编译直接失败。
  #
  # 协议中心（kronos-share-proto-template）默认生成三个模块：
  #   catalog/Product     单 service 完整 CRUD —— 本模板示例对接的就是它
  #   inventory/Warehouse 第二个单 service 示例
  #   tenant/Tenant       混合模块，一个模块多个 service
  #
  # [EN] The example is not an invented entity: it implements the hub's service, importing
  # <ShareProtoModule>/pb/<ExampleModule> and implementing every RPC of
  # <ExampleService>ServiceServer. Both values must match what the hub was generated with.
  # --------------------------------------------------------------------------
  - name: ExampleModule
    prompt: "示例对接的协议中心模块目录名（须与协议中心一致）| Contract-hub module the example implements"
    type: string
    default: catalog
    required: true

  - name: ExampleService
    prompt: "示例对接的 service 名（PascalCase，须与协议中心一致）| Service name the example implements"
    type: string
    default: Product
    required: true

  # 协议中心默认生成三个模块，模板把它们全部实现，用来覆盖三种形态：
  #   单 service 完整 CRUD（catalog/Product）
  #   第二个单 service，字段更简单、更新请求用 wrapper 可选字段（inventory/Warehouse）
  #   混合模块：一个模块里两个 service 共用 proto 包与 Go 包（tenant/Tenant + TenantMember）
  # 真实服务通常只实现自己那一个模块，把不需要的那几组删掉即可。
  #
  # [EN] The hub generates three modules and the template implements all of them to cover the
  # three shapes: a full CRUD service, a second simpler one whose update request uses wrapper
  # types, and a mixed module where two services share the proto and Go package. A real service
  # usually implements only its own module; delete the groups it does not need.
  - name: SecondModule
    prompt: "第二个模块目录名（须与协议中心一致）| Second module directory, must match the hub"
    type: string
    default: inventory
    required: true

  - name: SecondService
    prompt: "第二个 service 名（PascalCase）| Second service name"
    type: string
    default: Warehouse
    required: true

  - name: MixedModule
    prompt: "混合模块目录名（一个模块多个 service）| Mixed module directory, several services in one"
    type: string
    default: tenant
    required: true

  - name: MixedService
    prompt: "混合模块的聚合根 service 名（成员服务自动叫 XxxMember）| Aggregate-root service; the member service is named XxxMember"
    type: string
    default: Tenant
    required: true

  # 下游服务名：默认指向 kronos-key-service-template 生成出来的那个服务。
  #
  # 这不是一个造出来的 demo：ID 号段分发（models/idsource.go）确实需要一个
  # 中心发号者，而那正是 key-service 的 IdBlockService。本地 Snowflake 在
  # Deployment 下会撞 worker id（32 个槽位，8 副本 61% 概率），所以这个依赖
  # 是真实的，不是为了演示服务间调用而硬加的。
  #
  # [EN] Defaults to the service generated from kronos-key-service-template. This is not a
  # contrived demo: id block allocation genuinely needs a central issuer, which is exactly that
  # service's IdBlockService, because a local Snowflake collides on worker id under a Deployment
  # — 32 slots means a 61% chance with eight replicas. The dependency is real rather than added
  # to show off a service-to-service call.
  - name: DemoRemoteService
    prompt: "中心发号服务名（对应 grpc.clients 的 key）| Central id issuer service name"
    type: string
    default: "<% .ObjectPrefix %>-key-service"
    required: true

  - name: PipelineRepo
    prompt: "复用型工作流仓库（CI 复用它；不用 CI 可删 .github/workflows）| Reusable-workflow repository used by CI"
    type: string
    default: kamalyes/deploy-pipeline
    required: true

# ============================================================================
# 忽略规则 | Ignore rules
#
# ignore 判定的是「应用 rename 并渲染之后」的路径，模式本身也会被渲染，
# 所以可以按变量条件性地排除文件——这正是功能开关为「否」时不留孤立文件的做法
#
# 注意不要写 "*.md"：它按后缀匹配所有层级的 markdown，会把生成项目的全部文档
# 连同 AI 规范一起删掉（本模板 2.0.0 之前就是这个毛病，生成出来一个 md 都没有）
#
# [EN] ignore matches the path after rename AND rendering, and the patterns are rendered
# too, so files can be excluded per variable — that is how a disabled toggle avoids
# leaving orphan files. Never use "*.md": it suffix-matches markdown at every level and
# wipes the generated project's entire documentation, including the AI skill (which is
# exactly what this template did before 2.0.0).
# ============================================================================
ignore:
  # verify-template.yml 只服务于模板仓库自己（渲染自身并发布 build 分支），
  # 生成出来的项目不需要它——那边没有 kopy.yaml，渲染步骤必然失败。
  # 不排除的话每个生成仓库都会多一个永远红叉的工作流。
  #
  # [EN] verify-template.yml serves only the template repository, which renders itself and
  # publishes the build branch. A generated project has no kopy.yaml, so its render step would
  # always fail, and leaving it in gives every generated repository a permanently failing
  # workflow.
  - ".github/workflows/verify-template.yml"
  - "kopy.yaml"
  # 模板自身的说明文档：rename 后在此被忽略
  # [EN] The template's own documentation, renamed then ignored
  - "__kopy_template_doc__"
  - ".git/"
  - ".git/**"
  - ".DS_Store"
  # 示例实体：关掉就整组不生成，避免留下没人引用的孤立文件
  # [EN] Example entity: excluded as a group so nothing is left unreferenced
  - '<% if ne .GenerateExample "true" %>models/<% .ExampleService | snake %>_model.go<% end %>'
  - '<% if ne .GenerateExample "true" %>repository/<% .ExampleService | snake %>_repository.go<% end %>'
  - '<% if ne .GenerateExample "true" %>service/<% .ExampleModule %>/<% .ExampleService | snake %>_service.go<% end %>'
  - '<% if ne .GenerateExample "true" %>models/<% .SecondService | snake %>_model.go<% end %>'
  - '<% if ne .GenerateExample "true" %>repository/<% .SecondService | snake %>_repository.go<% end %>'
  - '<% if ne .GenerateExample "true" %>service/<% .SecondModule %>/<% .SecondService | snake %>_service.go<% end %>'
  - '<% if ne .GenerateExample "true" %>models/<% .MixedService | snake %>_model.go<% end %>'
  - '<% if ne .GenerateExample "true" %>models/<% .MixedService | snake %>_member_model.go<% end %>'
  - '<% if ne .GenerateExample "true" %>repository/<% .MixedService | snake %>_repository.go<% end %>'
  - '<% if ne .GenerateExample "true" %>repository/<% .MixedService | snake %>_member_repository.go<% end %>'
  - '<% if ne .GenerateExample "true" %>service/<% .MixedModule %>/<% .MixedService | snake %>_service.go<% end %>'
  - '<% if ne .GenerateExample "true" %>service/<% .MixedModule %>/<% .MixedService | snake %>_member_service.go<% end %>'
  # 下游同步 worker：示例关掉、或订阅关掉（没人启动它）时都不生成
  # [EN] The downstream sync worker is not emitted when the example is off, nor when the
  # subscriber is off, since nothing would start it
  - '<% if or (ne .GenerateExample "true") (ne .UseSubscriber "true") %>service/<% .MixedModule %>/<% .MixedService | snake %>_sync_worker.go<% end %>'
  # 事件订阅：默认关，关掉则不生成
  # [EN] Event subscriber: off by default and not emitted when disabled
  - '<% if ne .UseSubscriber "true" %>bootstrap/subscriber.go<% end %>'

# ============================================================================
# 重命名规则 | Rename rules
#
# 顺序敏感：规则按顺序对同一个路径字符串做 ReplaceAll
#   1. 先把模板自述改名成忽略标记，使它不进入生成项目
#   2-3. 两份文档模板落位成生成项目的 README.md / README.en.md
#   4+. 占位目录名替换成模板变量
# 注意 "readme-en.tpl" 不含子串 "readme.tpl"，两条规则互不干扰
#
# [EN] Order matters: rules run as sequential ReplaceAll calls on the same path.
# Note that "readme-en.tpl" does not contain the substring "readme.tpl".
# ============================================================================
rename:
  # 工作流在模板仓库里带 .tpl 后缀，渲染时去掉
  # 原因：GitHub Actions 会解析模板仓库自己的 .github/workflows/*.yml，而里面的
  # 占位符还没渲染（branches: - <% .BaseBranch %> 会被 YAML 读成嵌套序列），
  # 模板仓库会一直挂着无效工作流的红叉
  #
  # [EN] Workflow files carry a .tpl suffix in the template repository and lose it on
  # render, because GitHub Actions parses the template repo's own workflows, where the
  # placeholders are still unrendered and fail to parse.
  - pattern: ".yml.tpl"
    value: ".yml"
  - pattern: "README.md"
    value: "__kopy_template_doc__"
  - pattern: "readme-en.tpl"
    value: "README.en.md"
  - pattern: "readme.tpl"
    value: "README.md"
  - pattern: "__ai_home__"
    value: "<% .AiAssistant %>"
  - pattern: "__project_name__"
    value: "<% .ProjectName %>"
  - pattern: "__service_name__"
    value: "<% .ServiceName | snake %>"
  - pattern: "__module_name__"
    value: "<% .ModuleName %>"
  # 模块目录名：service/ 下按业务模块分包，与 proto/ 的模块划分一一对应
  # [EN] Module directory names: service/ is split into one package per business module,
  # matching the module layout under proto/
  - pattern: "__example_module__"
    value: "<% .ExampleModule %>"
  - pattern: "__second_module__"
    value: "<% .SecondModule %>"
  - pattern: "__mixed_module__"
    value: "<% .MixedModule %>"
  - pattern: "__example_service__"
    value: "<% .ExampleService | snake %>"
  - pattern: "__second_service__"
    value: "<% .SecondService | snake %>"
  - pattern: "__mixed_member__"
    value: "<% .MixedService | snake %>_member"
  - pattern: "__mixed_service__"
    value: "<% .MixedService | snake %>"

# ============================================================================
# 生命周期钩子 | Lifecycle hooks
#
# 一条命令打通：解析协议中心依赖 → go mod tidy → build → test
# 顺序由脚本保证，详见 scripts/init.sh 的注释
# kopy 默认会先列出命令再询问（--hooks always 可免询问，CI 用）
#
# [EN] A single command resolves the contract-hub dependency, tidies, builds and tests.
